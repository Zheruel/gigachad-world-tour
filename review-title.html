<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Tour — Animated title options</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101017;color:#eee6d7}body{max-width:1060px;margin:auto;padding:26px}h1{font-size:25px;margin:0 0 8px}p{color:#c2b9aa;font-size:14px;margin:0 0 18px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:22px}button,select{font:inherit;color:inherit;background:#201e23;border:1px solid #60513c;border-radius:5px;cursor:pointer}button:hover{border-color:#ecc879}button[aria-pressed=true]{border-color:#ffce66;box-shadow:0 0 0 1px #ffce66}.option{padding:8px;text-align:left}.option canvas{display:block;width:100%;height:auto;image-rendering:pixelated;margin-bottom:9px}.option strong{font-size:14px}.option small{display:block;color:#bdad98;font-size:12px;margin-top:4px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar button,select{padding:7px 11px}.toolbar label{font-size:13px}#stage{display:block;width:min(960px,100%);height:auto;image-rendering:pixelated;border:1px solid #5e4b32;box-shadow:0 16px 70px #0008}#stage.small{width:min(480px,100%)}h2{font-size:19px;margin:18px 0 6px}#status,#readout{font-size:12px;color:#d4c4a9}#timeline{flex:1;min-width:180px;accent-color:#ebc879}a{color:#ebc879}footer{font-size:12px;color:#998f83;margin-top:20px}@media(max-width:650px){body{padding:14px}.options{gap:8px}.option small{font-size:10px}}
</style></head><body>
<h1>World Tour · Animated title options</h1><p>Two CHAD performances, two interchangeable backdrops. Both previews play automatically.</p>
<div id="options" class="options"></div><h2 id="name"></h2><p id="description"></p>
<div class="toolbar"><button id="animate" aria-pressed="true">Pause</button><button id="scale">View at 1×</button><label>Backdrop <select id="background"><option value="">Default</option><option value="world">Global sunset</option><option value="sunset">India sunset</option><option value="midnight">Midnight</option></select></label><button id="save">Save this frame</button></div>
<canvas id="stage" width="960" height="540" aria-label="Animated title preview"></canvas>
<div class="toolbar"><button data-step="-1">−1 frame</button><input id="timeline" type="range" min="0" max="599" value="110" aria-label="Animation frame"><button data-step="1">+1 frame</button><span id="readout"></span></div>
<div class="toolbar"><label><input id="ui" type="checkbox" checked> Logo and menu</label><label><input id="effects" type="checkbox" checked> Smoke and lights</label><label><input id="hero" type="checkbox" checked> CHAD layer</label><label>Pose <select id="pose"><option value="">Inspect a pose…</option></select></label></div>
<p id="status" role="status">Loading layered artwork…</p><footer>480 × 270 logical canvas · 2× authored assets · <a href="./">Play the game</a></footer>
<script type="module" src="tools/verification/title_review.js"></script></body></html>
