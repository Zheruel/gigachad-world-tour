<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GIGACHAD: WORLD TOUR</title>
<link rel="icon" type="image/png" href="assets/portrait_chad_48.png">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
  }
  /* Fill the window keeping 16:9. The buffer is already 2x supersampled, so
     fractional scaling still reads crisp and beats thick letterbox bars. */
  #game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    width: 100vw; height: auto;
    max-width: calc(100vh * 16 / 9); max-height: 100vh;
    aspect-ratio: 16 / 9;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<script type="module" src="js/main.js"></script>
</body>
</html>
