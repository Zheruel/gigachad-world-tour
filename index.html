<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIGACHAD: WORLD TOUR</title>
<link rel="icon" type="image/png" href="assets/ui/portrait_chad_48.png">
<link rel="preload" as="image" href="assets/ui/logo.png">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
  }
  /* Fill the window keeping 16:9. The buffer is already 2x supersampled, so
     fractional scaling still reads crisp and beats thick letterbox bars. */
  #game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    width: 100vw; height: auto;
    max-width: calc(100vh * 16 / 9); max-height: 100vh;
    aspect-ratio: 16 / 9;
  }

  /* Load screen: plain HTML so it is up before a single module arrives (js/loading.js drives it). */
  #loader {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh;
    background: radial-gradient(ellipse at 50% 38%, #10203c 0%, #070b16 55%, #000 100%);
    color: #ffd94a; font: italic 900 16px/1 "Arial Black", Impact, "Helvetica Neue", sans-serif;
    text-transform: uppercase; letter-spacing: .06em;
    transition: opacity .35s ease;
  }
  #loader.out { opacity: 0; pointer-events: none; }
  #loader[hidden] { display: none; }
  #loader img { image-rendering: pixelated; display: block; }
  #loader .logo { width: min(78vw, 520px); height: auto; animation: bob 2.4s ease-in-out infinite; }
  #loader .stop { min-height: 1.4em; font-size: clamp(14px, 2.6vh, 22px); color: #fff3c2; text-align: center;
    text-shadow: 0 2px 0 #7a1a10, 2px 0 0 #7a1a10, -2px 0 0 #7a1a10, 0 -2px 0 #7a1a10; }
  #loader .stop small { display: block; font-size: .62em; color: #c9b27a; margin-bottom: .35em; text-shadow: none; }
  #loader .chad { height: clamp(96px, 26vh, 220px); width: auto; filter: drop-shadow(0 6px 0 rgba(0,0,0,.6)); }
  #loader .bar {
    position: relative; width: min(78vw, 460px); height: 22px; box-sizing: border-box;
    background: #1a0d08; border: 3px solid #7a1a10; outline: 3px solid #000; box-shadow: 0 0 0 6px #ffb52e33;
  }
  #loader .fill {
    position: absolute; inset: 0 auto 0 0; width: 0%;
    background: repeating-linear-gradient(90deg, transparent 0 10px, rgba(0,0,0,.22) 10px 12px),
                linear-gradient(#fff2a0, #ffd94a 40%, #f08a1a);
    transition: width .2s linear;
  }
  #loader.busy .fill { width: 30% !important; animation: sweep 1.1s ease-in-out infinite alternate; }
  #loader .status { display: flex; justify-content: space-between; width: min(78vw, 460px); font-size: clamp(11px, 1.9vh, 15px); }
  #loader .quip { color: #ffd94a; text-shadow: 0 2px 0 #7a1a10; }
  #loader .pct { color: #fff3c2; font-variant-numeric: tabular-nums; }
  #loader .mb { font: 600 11px/1 ui-monospace, Menlo, monospace; color: #6f7c99; letter-spacing: .04em; text-transform: none; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes sweep { from { left: 0; } to { left: 70%; } }
  @media (prefers-reduced-motion: reduce) { #loader .logo, #loader.busy .fill { animation: none; } }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="loader" class="busy" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
  <img class="logo" src="assets/ui/logo.png" alt="GIGACHAD: WORLD TOUR" width="520" height="165">
  <div class="stop"></div>
  <img class="chad" src="assets/frames/chad_sidle1.png" alt="" width="69" height="192">
  <div class="bar"><div class="fill"></div></div>
  <div class="status"><span class="quip">Warming up</span><span class="pct"></span></div>
  <div class="mb"></div>
</div>
<script>
// The load screen's look and motion; js/loading.js calls show / progress / hide.
(() => {
  const el = document.getElementById('loader'), q = (s) => el.querySelector(s);
  const fill = q('.fill'), pct = q('.pct'), quip = q('.quip'), stop = q('.stop'), chad = q('.chad'), mb = q('.mb');
  const QUIPS = ['Oiling the pecs', 'Sharpening the jawline', 'Loading aura', 'Waxing the chest', 'Lighting the cigar',
    'Calibrating the stare', 'Feeding the tiger', 'Polishing the chain', 'Pre-workout kicking in', 'Ironing the vest'];
  let shown = 0, target = 0, q0 = Math.floor(Math.random() * QUIPS.length), frame = 0, t0 = performance.now(), bytes = 0;
  // CHAD idles while he waits, on his own four idle frames.
  const idle = [1, 2, 3, 4].map((i) => { const im = new Image(); im.src = `assets/frames/chad_sidle${i}.png`; return im; });
  try {
    new PerformanceObserver((list) => {
      for (const e of list.getEntries()) bytes += e.transferSize || e.encodedBodySize || 0;
    }).observe({ type: 'resource', buffered: true });
  } catch (e) { /* no byte count: the bar still runs */ }
  function tick(now) {
    if (el.hidden) return;
    requestAnimationFrame(tick);
    if (now - t0 > 160) { t0 = now; frame = (frame + 1) % 4; if (idle[frame].complete) chad.src = idle[frame].src; }
    shown += (target - shown) * .12;
    if (!el.classList.contains('busy')) { fill.style.width = (shown * 100).toFixed(1) + '%'; pct.textContent = Math.round(shown * 100) + '%'; }
    el.setAttribute('aria-valuenow', Math.round(shown * 100));
    quip.textContent = QUIPS[(q0 + Math.floor(now / 1700)) % QUIPS.length];
    if (bytes) mb.textContent = (bytes / 1048576).toFixed(1) + ' MB';
  }
  window.GachiLoader = {
    show(title) {
      shown = target = 0; el.hidden = false; el.classList.remove('out');
      stop.innerHTML = title ? '<small>Next stop</small>' + title.replace(/[<&]/g, '') : '';
      requestAnimationFrame(tick);
    },
    progress(p) { el.classList.remove('busy'); target = Math.max(target, Math.min(1, p)); },
    hide() {
      target = shown = 1; el.classList.add('out');
      setTimeout(() => { if (el.classList.contains('out')) el.hidden = true; }, 380);
    },
  };
  requestAnimationFrame(tick);
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
