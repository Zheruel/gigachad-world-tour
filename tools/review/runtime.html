<!doctype html><html lang="en"><head><meta charset="utf-8"><base href="../../"><title>Review runtime</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}</style></head><body><canvas id="game" width="960" height="540"></canvas><script>
// The real game runs here, but review rewards never touch campaign storage.
const memory=new Map();const storage={getItem:k=>memory.get(String(k))??null,setItem:(k,v)=>memory.set(String(k),String(v)),removeItem:k=>memory.delete(String(k)),clear:()=>memory.clear(),key:i=>[...memory.keys()][i]??null,get length(){return memory.size}};
Object.defineProperty(window,'localStorage',{value:storage});Object.defineProperty(window,'sessionStorage',{value:storage});
Object.defineProperty(navigator,'getGamepads',{configurable:true,value:()=>[]});
for(const kind of ['keydown','keyup','pointerdown'])window.addEventListener(kind,e=>{if(e.reviewReplay)return;e.stopImmediatePropagation();if(kind!=='pointerdown')e.preventDefault();parent.dispatchEvent(new CustomEvent('review-input',{detail:{type:kind,code:e.code,x:e.offsetX,y:e.offsetY,button:e.button}}));},true);
</script><script type="module" src="js/main.js"></script></body></html>
